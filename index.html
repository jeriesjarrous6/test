<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shongxbong | Terminal</title>
    <style>
        /* إعدادات الخطوط والخلفية الأساسية */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000;
            color: #ff0000;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* خلفية تساقط الحروف */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.35;
        }

        /* نافذة الترمنال الرئيسية */
        .terminal {
            position: relative;
            z-index: 10;
            width: 700px;
            max-width: 90vw;
            background: rgba(10, 0, 0, 0.85);
            border: 2px solid #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
            border-radius: 5px;
            overflow: hidden;
        }

        /* شريط العنوان العلوي */
        .terminal-header {
            background: #ff0000;
            color: #000;
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        .window-buttons span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #000;
            margin-left: 5px;
            border-radius: 50%;
        }

        /* محتوى الترمنال */
        .terminal-body {
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.7);
        }

        .line {
            margin-bottom: 10px;
            white-space: pre-wrap;
        }

        .prompt {
            color: #990000;
        }

        .command {
            color: #fff;
        }

        /* شريط التحميل Progress Bar */
        .progress-container {
            display: flex;
            align-items: center;
            margin-top: 5px;
        }

        .progress-bar {
            width: 250px;
            height: 15px;
            border: 1px solid #ff0000;
            margin-right: 10px;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: #ff0000;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* واجهة الاختراق / النجاح النهائية */
        .success-screen {
            display: none;
            text-align: center;
            animation: fadeIn 1s ease-in-out forwards;
        }

        .success-title {
            font-size: 35px;
            letter-spacing: 5px;
            margin-bottom: 15px;
            color: #fff;
            text-shadow: 0 0 10px #ff0000;
        }

        /* مكان الصورة التعبيرية */
        .image-container {
            width: 100%;
            max-height: 200px;
            background: #111;
            border: 1px dashed #ff0000;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
        }

        .image-container img {
            max-width: 100%;
            max-height: 200px;
            object-fit: cover;
            filter: grayscale(100%) contrast(150%) sepia(100%) hue-rotate(-50deg);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="terminal">
        <div class="terminal-header">
            <span id="window-title">root@shongxbong:~</span>
            <div class="window-buttons">
                <span></span><span></span><span></span>
            </div>
        </div>
        
        <div class="terminal-body" id="terminal-content">
            </div>
    </div>

<script>
    // 1. كود خلفية Matrix Rain (باللون الأحمر)
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // الحروف المستخدمة (اليابانية السيبرانية الخفيفة)
    const katakana = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890";
    const alphabet = katakana.split("");

    const fontSize = 16;
    const columns = canvas.width / fontSize;

    const rainDrops = [];
    for (let x = 0; x < columns; x++) {
        rainDrops[x] = 1;
    }

    const drawMatrix = () => {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#ff0000'; // اللون الأحمر
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < rainDrops.length; i++) {
            const text = alphabet[Math.floor(Math.random() * alphabet.length)];
            ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

            if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                rainDrops[i] = 0;
            }
            rainDrops[i]++;
        }
    };

    setInterval(drawMatrix, 30);

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });


    // 2. محاكاة الـ Terminal Script التلقائي
    const content = document.getElementById('terminal-content');
    const winTitle = document.getElementById('window-title');

    // لستة السطور والتأخير الزمني بينها بالملي ثانية
    const scripts = [
        { text: '<span class="prompt">[root@shongxbong]~#</span> <span class="command">ssh connect void.net</span>', delay: 1000 },
        { text: 'Connecting .................... [ OK ]', delay: 800 },
        { text: 'Login: <span class="command">shongxbong</span>', delay: 1200 },
        { text: 'Password: <span class="command">************</span>', delay: 1000 },
        { text: 'Authenticating...', isProgressBar: true, delay: 2000 },
        { text: '<span style="color: #00ff00;">[root@shongxbong] Access GRANTED /</span>', delay: 800 },
        { text: `Last Login: ${new Date().toUTCString()}`, delay: 1000 },
        { text: '<span class="prompt">[root@shongxbong]~#</span> <span class="command">set profile.cfg</span>', delay: 1200 },
        { text: 'Handle: shongxbong<br>Location: Unknown<br>Status: <span style="color:#00ff00;">Online</span>', delay: 1500 },
        { text: '<span class="prompt">[root@shongxbong]~#</span> <span class="command">set links.txt</span>', delay: 800 },
        { text: 'discord: discord.gg/', delay: 1000 },
        { clearAndShowTarget: true, delay: 500 } // الانتقال للواجهة النهائية
    ];

    let currentStep = 0;

    function runTerminal() {
        if (currentStep >= scripts.length) return;

        const step = scripts[currentStep];

        if (step.clearAndShowTarget) {
            // تحويل الترمنال للشاشة النهائية مثل الفيديو
            winTitle.innerText = "FUCKED BY shongxbong";
            content.innerHTML = `
                <div class="success-screen">
                    <div class="success-title">FUCKED BY shongxbong</div>
                    <div class="image-container">
                        <img src="https://i.pinimg.com/736x/65/9a/e9/659ae9fa0a9242929035bd0d82f903a7.jpg" alt="Target Screen">
                    </div>
                    <p style="color: #fff; font-size: 18px; margin-bottom: 10px;">discord.gg/</p>
                    <p style="color: #ff0000; font-size: 20px; font-weight: bold;">"fucked by shongxbong "</p>
                    <p style="color: #555; margin-top: 15px; font-size: 12px;">THIS IS JUST THE BEGINNING...</p>
                </div>
            `;
            document.querySelector('.success-screen').style.display = 'block';
            return;
        }

        if (step.isProgressBar) {
            // إنشاء شريط التحميل الآلي
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = `${step.text} <div class="progress-container"><div class="progress-bar"><div class="progress-fill" id="p-fill"></div></div> <span id="p-text">0%</span></div>`;
            content.appendChild(line);
            
            let progress = 0;
            const fill = document.getElementById('p-fill');
            const pText = document.getElementById('p-text');
            
            const interval = setInterval(() => {
                progress += 5;
                if (progress <= 100) {
                    fill.style.width = progress + '%';
                    pText.innerText = progress + '%';
                } else {
                    clearInterval(interval);
                    currentStep++;
                    setTimeout(runTerminal, 500);
                }
            }, 50);
            
        } else {
            // طباعة السطور العادية
            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = step.text;
            content.appendChild(line);
            
            // سكرول تلقائي لأسفل الترمنال
            content.scrollTop = content.scrollHeight;

            currentStep++;
            setTimeout(runTerminal, step.delay);
        }
    }

    // تشغيل السكريبت بعد تحميل الصفحة مباشرة
    window.onload = () => {
        setTimeout(runTerminal, 500);
    };
</script>
</body>
</html>
