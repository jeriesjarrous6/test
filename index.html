<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pom pom</title>
    <style>
        body {

            padding: 0;
            display: flex;
            justify-content: center;

        }

        .info { font-size: 1.2em; margin-bottom: 10px; }
        .ip-address, .location, .isp, .timezone, .coordinates, .server-status {
            font-size: 1em;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
